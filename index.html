<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=25" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="shell">
      <aside class="sidebar" aria-label="카테고리">
        <header class="sidebar-header">
          <button type="button" class="menu-btn" aria-label="메뉴">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <h1 class="app-title">Todo App</h1>
        </header>

        <nav class="side-nav" aria-label="카테고리 목록">
          <button
            type="button"
            class="side-nav-item is-active"
            data-category="all"
          >
            <span class="side-nav-icon" aria-hidden="true">◎</span>
            <span class="side-nav-label">전체</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
          <button type="button" class="side-nav-item" data-category="work">
            <span class="side-nav-icon" aria-hidden="true">▣</span>
            <span class="side-nav-label">업무</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
          <button type="button" class="side-nav-item" data-category="study">
            <span class="side-nav-icon" aria-hidden="true">▤</span>
            <span class="side-nav-label">공부</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
          <button type="button" class="side-nav-item" data-category="exercise">
            <span class="side-nav-icon" aria-hidden="true">◈</span>
            <span class="side-nav-label">운동</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
          <button type="button" class="side-nav-item" data-category="personal">
            <span class="side-nav-icon" aria-hidden="true">◇</span>
            <span class="side-nav-label">개인</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
          <button type="button" class="side-nav-item" data-category="hobby">
            <span class="side-nav-icon" aria-hidden="true">☆</span>
            <span class="side-nav-label">취미</span>
            <span class="side-nav-arrow" aria-hidden="true">›</span>
          </button>
        </nav>
      </aside>

      <main class="app">
        <div class="view-bar">
          <nav class="view-tabs" aria-label="상태 보기">
            <button
              type="button"
              class="view-tab is-active"
              data-view="all"
              aria-selected="true"
            >
              All
            </button>
            <button
              type="button"
              class="view-tab"
              data-view="todo"
              aria-selected="false"
            >
              To do
            </button>
            <button
              type="button"
              class="view-tab"
              data-view="doing"
              aria-selected="false"
            >
              In Progress
            </button>
            <button
              type="button"
              class="view-tab"
              data-view="done"
              aria-selected="false"
            >
              Done
            </button>
          </nav>

          <button type="button" class="btn btn-open-add" id="open-add-btn">
            + 추가하기
          </button>
        </div>

        <section class="board" aria-label="칸반 보드">
          <div class="column" data-status="todo">
            <div class="column-header">
              <h2>To do List</h2>
              <button
                type="button"
                class="btn btn-add-column"
                data-add-status="todo"
                aria-label="To do에 추가"
              >
                +
              </button>
            </div>
            <ul class="column-list" id="list-todo"></ul>
            <p class="column-empty" id="empty-todo">항목 없음</p>
          </div>

          <div class="column" data-status="doing">
            <div class="column-header">
              <h2>In Progress</h2>
              <button
                type="button"
                class="btn btn-add-column"
                data-add-status="doing"
                aria-label="In Progress에 추가"
              >
                +
              </button>
            </div>
            <ul class="column-list" id="list-doing"></ul>
            <p class="column-empty" id="empty-doing">항목 없음</p>
          </div>

          <div class="column" data-status="done">
            <div class="column-header">
              <h2>Done</h2>
              <button
                type="button"
                class="btn btn-add-column"
                data-add-status="done"
                aria-label="Done에 추가"
              >
                +
              </button>
            </div>
            <ul class="column-list" id="list-done"></ul>
            <p class="column-empty" id="empty-done">항목 없음</p>
          </div>
        </section>
      </main>

      <aside class="calendar-panel" aria-label="캘린더">
        <section class="calendar-card">
          <div class="calendar-header">
            <button type="button" class="btn btn-ghost calendar-nav" id="cal-prev" aria-label="이전 달">
              ‹
            </button>
            <h2 class="calendar-title" id="calendar-title">2026년 11월</h2>
            <button type="button" class="btn btn-ghost calendar-nav" id="cal-next" aria-label="다음 달">
              ›
            </button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span>
            <span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </section>

        <section class="today-panel">
          <h3 class="today-title">선택한 날짜 할일</h3>
          <ul class="today-list" id="today-list"></ul>
          <p class="today-empty" id="today-empty">이 날짜의 할일이 없습니다.</p>
        </section>
      </aside>
    </div>

    <div class="modal" id="add-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-modal-title"
      >
        <div class="modal-header">
          <h2 id="add-modal-title">새 할일 추가</h2>
          <button
            type="button"
            class="btn btn-ghost modal-close"
            data-close-modal
            aria-label="닫기"
          >
            ✕
          </button>
        </div>

        <form class="modal-form" id="todo-form" autocomplete="off">
          <label class="modal-field" for="todo-input">
            <input
              id="todo-input"
              class="todo-input"
              type="text"
              name="todo"
              placeholder="할일"
              maxlength="200"
              required
            />
          </label>

          <label class="modal-field" for="todo-memo">
            <textarea
              id="todo-memo"
              class="memo-input"
              name="memo"
              rows="2"
              maxlength="500"
              placeholder="메모 (선택)"
            ></textarea>
          </label>

          <div class="modal-row">
            <label class="modal-field" for="todo-due-date">
              <input
                id="todo-due-date"
                class="date-input"
                type="date"
                required
                aria-label="마감일"
              />
            </label>

            <label class="modal-field" for="todo-category">
              <select
                id="todo-category"
                class="status-select"
                aria-label="카테고리"
              >
                <option value="work">업무</option>
                <option value="study">공부</option>
                <option value="exercise">운동</option>
                <option value="personal">개인</option>
                <option value="hobby">취미</option>
              </select>
            </label>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal>
              취소
            </button>
            <button type="submit" class="btn btn-primary" id="submit-btn">
              추가하기
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="detail-modal" hidden>
      <div class="modal-backdrop" data-close-detail></div>
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-modal-title"
      >
        <div class="modal-header">
          <h2 id="detail-modal-title">할일 상세</h2>
          <button
            type="button"
            class="btn btn-ghost modal-close"
            data-close-detail
            aria-label="닫기"
          >
            ✕
          </button>
        </div>

        <form class="modal-form" id="detail-form" autocomplete="off">
          <p class="detail-dday" id="detail-dday"></p>

          <label class="modal-field" for="detail-title">
            <input
              id="detail-title"
              class="todo-input"
              type="text"
              name="title"
              placeholder="할일"
              maxlength="200"
              required
            />
          </label>

          <label class="modal-field" for="detail-memo">
            <textarea
              id="detail-memo"
              class="memo-input"
              name="memo"
              rows="3"
              maxlength="500"
              placeholder="메모 (선택)"
            ></textarea>
          </label>

          <div class="modal-row">
            <label class="modal-field" for="detail-due-date">
              <input
                id="detail-due-date"
                class="date-input"
                type="date"
                required
                aria-label="마감일"
              />
            </label>

            <label class="modal-field" for="detail-category">
              <select
                id="detail-category"
                class="status-select"
                aria-label="카테고리"
              >
                <option value="work">업무</option>
                <option value="study">공부</option>
                <option value="exercise">운동</option>
                <option value="personal">개인</option>
                <option value="hobby">취미</option>
              </select>
            </label>
          </div>

          <div class="modal-actions modal-actions-split">
            <button type="button" class="btn btn-danger" id="detail-delete-btn">
              삭제
            </button>
            <div class="modal-actions-right">
              <button type="button" class="btn btn-ghost" data-close-detail>
                취소
              </button>
              <button type="submit" class="btn btn-primary" id="detail-save-btn">
                저장
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js?v=25"></script>
  </body>
</html>
